[project]
name = "feishu-agent-hub-backend"
version = "0.1.0"
description = "Local backend for Local Agent Hub — wraps lark-cli and orchestrates agents."
# 3.12 起步，不是 3.11：html/renderer.py 在 f-string 里用了反斜杠转义
# （`f"...{re.sub(r'^\s*\d+[.)]\s+', ...)}..."`），这个语法 3.12 才合法。
# 声明成 >=3.11 的代价不是装不上，而是 **ruff 按 3.11 解析、整个仓的 lint 直接
# 报语法错**，于是仓级 F821 检查跑不起来 —— 而那个检查正是 6.0 那次
# NameError（diagnostics 里漏了 llm = get_llm()）之后才加的。声明宽一格，
# 就等于把当初为防回归加的那道闸门关掉了。捆绑运行时实际是 3.13.3。
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "anyio>=4.4",
    "python-multipart>=0.0.9",
    # 文件解析：PDF（云盘 PDF 识别）+ Office/HTML（云盘上传文件解析）
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "python-pptx>=0.6.23",
    # 本地目录：全局快捷键（Enter 触发截图）。截图本身复用已内置的 Pillow（ImageGrab）。
    "keyboard>=0.13.5",
    # 本地邮箱：Outlook COM（pythoncom / win32com.client）。**必须显式声明** ——
    # 它此前只是恰好装在开发机的 venv 里，全新环境重建 venv 后打包会得到一个
    # 「本地邮箱一点就报 ModuleNotFoundError」的安装包，而构建本身不报错。
    "pywin32>=306",
    # 语音速记：WASAPI 采集。**必须是 pyaudiowpatch，不能换成 sounddevice** ——
    # sounddevice 0.5.6 捆的 PortAudio V19.7.0-devel 里 WasapiSettings 没有
    # loopback 参数，压根不提供系统回环采集，而「录会议里对方的声音」只能靠回环。
    # 详细实测记录见 app/services/voice_capture.py 头注。
    #
    # 它的原生扩展是**顶层**模块 _portaudiowpatch（不在包里面），打包时两个都要
    # 显式列进 launcher.spec 的 hiddenimports —— voice_capture.py 是在函数内部
    # 惰性 import 的，PyInstaller 的静态分析看不见。
    "pyaudiowpatch>=0.2.12",
    # 语音速记：传进来的音频 / 视频文件解码。**AAC 这一格把别的选项全筛掉了** ——
    # 要覆盖的是手机录音（iPhone 语音备忘录是 .m4a）和会议回放（.mp4），而
    # soundfile / miniaudio 都不支持 AAC，系统 ffmpeg 不能假定装了，
    # Windows Media Foundation 在 Server 上默认没装（验不了）。
    # PyAV 自带 ffmpeg，pip 就能装，连视频的音轨也能直接取。
    #
    # 代价：落盘 68 MB，其中 63 MB 是 ffmpeg 的 DLL，而里面约 30 MB 是我们完全
    # 用不到的**视频编码器**（libx265 12.2 MB、libSvtAv1Enc 7.3 MB、libx264、
    # libvpx、libdav1d、swscale）。想砍要先打包实测：PyAV 的扩展模块是链着
    # avfilter / swscale 的，乱排除会变成 import 就炸。
    "av>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
