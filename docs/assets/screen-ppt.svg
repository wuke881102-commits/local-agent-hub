      <rect x="0" y="158" width="330" height="30" rx="8" fill="#E8F7EE"/>
      <text class="grn" x="14" y="178" font-size="12">📄 示例：客服中心季度复盘</text>
      <text class="sub" x="0" y="214" font-size="12">输出格式</text>
      <rect x="0" y="224" width="161" height="48" rx="10" fill="#fff" stroke="#E0E6E2"/>
      <text class="dk" x="14" y="245" font-size="13" font-weight="700">HTML 页面</text><text class="mut" x="14" y="262" font-size="10.5">单页长文</text>
      <rect x="169" y="224" width="161" height="48" rx="10" fill="#E8F7EE" stroke="#00AA4F" stroke-width="1.5"/>
      <text class="grn" x="183" y="245" font-size="13" font-weight="700">PPT 幻灯片</text><text class="mut" x="183" y="262" font-size="10.5">.pptx · 可编辑</text>
      <circle cx="5" cy="290.5" r="1.8" fill="#8A968F"/>
      <text class="sub" x="12" y="294" font-size="10.5">产出 .pptx，可直接编辑；不写回飞书（需要三项当前没有的权限）</text>
      <circle cx="5" cy="307.5" r="1.8" fill="#8A968F"/>
      <text class="sub" x="12" y="311" font-size="10.5">一张图一页还原，另附一页原图供核对</text>
      <circle cx="5" cy="324.5" r="1.8" fill="#8A968F"/>
      <text class="sub" x="12" y="328" font-size="10.5">只还原网格结构 —— 箭头、图标、渐变、自由摆放不还原</text>
      <circle cx="5" cy="341.5" r="1.8" fill="#8A968F"/>
      <text class="sub" x="12" y="345" font-size="10.5">文字会有形近字错误，原图页就是用来核对的</text>
      <circle cx="5" cy="358.5" r="1.8" fill="#8A968F"/>
      <text class="sub" x="12" y="362" font-size="10.5">慢：每张图 5–7 次模型调用，十几张图是十分钟量级</text>
      <circle cx="5" cy="375.5" r="1.8" fill="#8A968F"/>
      <text class="sub" x="12" y="379" font-size="10.5">文字为主的文档会被重组成 8–12 页讲稿，内容有取舍；</text>
      <text class="sub" x="12" y="396" font-size="10.5">没用上的章节列在最后一页</text>
      <circle cx="5" cy="409.5" r="1.8" fill="#8A968F"/>
      <text class="sub" x="12" y="413" font-size="10.5">讲稿里的数字和表格都要在原文里对得上，</text>
      <text class="sub" x="12" y="430" font-size="10.5">对不上的会被丢掉（日志里写明）</text>
      <rect x="0" y="456" width="120" height="38" rx="10" class="grn"/>
      <text x="60" y="480" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✧ 生成 PPT</text>
      <rect x="130" y="456" width="84" height="38" rx="10" fill="#fff" stroke="#E0E6E2"/>
      <text class="sub" x="172" y="480" font-size="12.5" text-anchor="middle">⇩ 下载</text>
      <text class="mut" x="0" y="526" font-size="10.5" letter-spacing="1">运行日志</text>
      <rect x="0" y="536" width="330" height="206" rx="10" fill="#10231A"/>
      <text class="m" x="12" y="556" font-size="10" fill="#5F7A6B">10:02:11</text>
      <text class="m" x="70" y="556" font-size="10" fill="#B8F0CD">抽取「示例：客服中心季度复盘」（docx）…</text>
      <text class="m" x="12" y="575" font-size="10" fill="#5F7A6B">10:02:13</text>
      <text class="m" x="70" y="575" font-size="10" fill="#B8F0CD">正文 8,600 字 / 图片 3 张</text>
      <text class="m" x="70" y="590" font-size="10" fill="#B8F0CD">= 2867 字每张 → 重组成讲稿</text>
      <text class="m" x="12" y="609" font-size="10" fill="#5F7A6B">10:02:13</text>
      <text class="m" x="70" y="609" font-size="10" fill="#B8F0CD">文字为主的文档，交给模型重组成讲稿</text>
      <text class="m" x="70" y="624" font-size="10" fill="#B8F0CD">（整篇读一次，约 1–3 分钟）…</text>
      <text class="m" x="12" y="643" font-size="10" fill="#5F7A6B">10:03:58</text>
      <text class="m" x="70" y="643" font-size="10" fill="#B8F0CD">模型给出 9 页讲稿</text>
      <text class="m" x="70" y="658" font-size="10" fill="#B8F0CD">（原文 12 节，1 张带说明的图可选）</text>
      <text class="m" x="12" y="677" font-size="10" fill="#5F7A6B">10:03:58</text>
      <text class="m" x="70" y="677" font-size="10" fill="#B8F0CD">有 1 节没有用进讲稿，已列在最后一页：</text>
      <text class="m" x="70" y="692" font-size="10" fill="#B8F0CD">附录：术语表</text>
      <text class="m" x="12" y="711" font-size="10" fill="#5F7A6B">10:04:02</text>
      <text class="m" x="70" y="711" font-size="10" fill="#B8F0CD">已生成 t-5c1e9a.pptx：</text>
      <text class="m" x="70" y="726" font-size="10" fill="#B8F0CD">讲稿 11 页，配图 1 张</text>
      </g>

