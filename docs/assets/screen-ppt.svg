    <!-- config panel -->
      <g transform="translate(28,72)" class="t">
      <text class="dk" x="0" y="24" font-size="19" font-weight="800">PPT 幻灯片生成</text>
      <text class="sub" x="0" y="50" font-size="12">选一篇飞书文档，产出可编辑的 .pptx。图片为主的每张图</text>
      <text class="sub" x="0" y="68" font-size="12">还原成一页、后面紧跟原图；文字为主的重组成 8–12 页讲稿。</text>
      <rect x="0" y="84" width="330" height="38" rx="10" fill="#EEF2F0"/>
      <rect x="4" y="88" width="161" height="30" rx="8" fill="#fff" stroke="#E0E6E2"/>
