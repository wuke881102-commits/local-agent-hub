<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="个人摘记 (示例数据)">
  <defs>
    <style>
      .t{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .mut{fill:#8A968F} .dk{fill:#0F2A1C} .sub{fill:#5B6B62} .grn{fill:#00AA4F}
      .card{fill:#fff;stroke:#E6EBE8;stroke-width:1.5}
    </style>
  </defs>
  <rect x="6" y="6" width="1428" height="888" rx="16" fill="#fff" stroke="#DDE3DF" stroke-width="1.5"/>
  <rect x="6" y="6" width="1428" height="44" rx="16" fill="#F3F6F4"/><rect x="6" y="34" width="1428" height="16" fill="#F3F6F4"/>
  <g><circle cx="34" cy="28" r="6" fill="#FF5F57"/><circle cx="56" cy="28" r="6" fill="#FEBC2E"/><circle cx="78" cy="28" r="6" fill="#28C840"/></g>
  <rect x="520" y="17" width="400" height="24" rx="12" fill="#E7ECE9"/>
  <text class="t mut" x="720" y="33" font-size="12" text-anchor="middle">127.0.0.1:8787 · 个人摘记</text>
  <rect x="7" y="50" width="1426" height="843" fill="#F4F7F5"/>

  <!-- sidebar -->
  <g transform="translate(7,50)">
    <rect width="248" height="843" fill="#FBFCFC" stroke="#EAEFEC" stroke-width="1.5"/>
    <rect x="22" y="22" width="40" height="40" rx="11" class="grn"/>
    <text class="t" x="42" y="48" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">本</text>
    <text class="t dk" x="74" y="40" font-size="15" font-weight="800">本地 Agent 工作台</text>
    <text class="t mut" x="74" y="57" font-size="10" letter-spacing="1">LOCAL AGENT HUB · v6.6</text>
    <text class="t mut" x="24" y="96" font-size="11" letter-spacing="2">导航</text>
    <g class="t sub" font-size="13.5">
      <text x="30" y="128">⌂  工作台</text><text x="30" y="162">✧  任务场景</text><text x="30" y="196">≣  运行记录</text>
      <text x="30" y="230">▤  飞书文档</text><text x="30" y="264">▢  本地目录</text><text x="30" y="298">▦  历史总结</text><text x="30" y="332">⋔  组织架构</text>
      <text x="30" y="366">△  本地邮箱</text>
    </g>
    <rect x="14" y="382" width="220" height="30" rx="8" fill="#E8F7EE"/>
    <text class="t grn" x="30" y="402" font-size="13.5" font-weight="700">▤  个人摘记</text>
    <text class="t mut" x="24" y="442" font-size="11" letter-spacing="2">AGENTS</text>
    <g class="t" font-size="13">
      <g><circle cx="30" cy="468" r="5" fill="#22C55E"/><text class="dk" x="46" y="472">HTML 页面生成</text><text class="mut" x="196" y="472" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="498" r="5" fill="#3B82F6"/><text class="dk" x="46" y="502">文档地图</text><text class="mut" x="196" y="502" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="528" r="5" fill="#EC4899"/><text class="dk" x="46" y="532">摘要标签回填</text><text class="mut" x="196" y="532" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="558" r="5" fill="#22C55E"/><text class="dk" x="46" y="562">知识治理</text><text class="mut" x="196" y="562" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="588" r="5" fill="#EAB308"/><text class="dk" x="46" y="592">多维表格分析</text><text class="mut" x="196" y="592" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="618" r="5" fill="#8B5CF6"/><text class="dk" x="46" y="622">PDF 识别</text><text class="mut" x="196" y="622" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="648" r="5" fill="#F97316"/><text class="dk" x="46" y="652">会议纪要</text><text class="mut" x="196" y="652" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="678" r="5" fill="#EF4444"/><text class="dk" x="46" y="682">协作分发</text><text class="mut" x="196" y="682" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="708" r="5" fill="#0EA5E9"/><text class="dk" x="46" y="712">AIHot 模型榜</text><text class="mut" x="196" y="712" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="738" r="5" fill="#14B8A6"/><text class="dk" x="46" y="742">AIHot 新闻简报</text><text class="mut" x="196" y="742" font-size="11">就绪</text></g>
      <g><circle cx="30" cy="768" r="5" fill="#0EA5E9"/><text class="dk" x="46" y="772">自动化提炼</text><text class="mut" x="196" y="772" font-size="11">就绪</text></g>
    </g>
  </g>

  <!-- main -->
  <g transform="translate(255,50)">
    <rect width="1178" height="52" fill="#FBFCFC" stroke="#EAEFEC" stroke-width="1.5"/>
    <text class="t sub" x="36" y="32" font-size="13.5">☰   工作台  ›  个人摘记</text>

    <text class="t dk" x="300" y="100" font-size="24" font-weight="800">个人摘记</text>
    <text class="t sub" x="300" y="126" font-size="12.5">按你设的频率，把各处的进展合成一条，发到你自己的飞书  ·  只发给你自己，不发给任何其他人</text>

    <!-- main card -->
    <g transform="translate(300,150)">
      <rect class="card" width="600" height="228" rx="14"/>

      <rect x="24" y="24" width="40" height="40" rx="11" fill="#E8F7EE"/>
      <text class="t grn" x="44" y="51" font-size="17" text-anchor="middle">▤</text>
      <text class="t dk" x="78" y="42" font-size="15" font-weight="800">定时摘记进行中</text><circle cx="196" cy="37" r="5" fill="#22C55E"/>
      <text class="t sub" x="78" y="64" font-size="12">每 4 小时一次 · 下次 03-04 11:48</text>
      <text class="t sub" x="452" y="45" font-size="12.5">停止</text>
      <text class="t sub" x="500" y="45" font-size="12.5">立即推一条</text>

      <!-- frequency -->
      <text class="t sub" x="24" y="106" font-size="12">频率</text>
      <rect x="72" y="88" width="420" height="26" rx="7" fill="#EEF2F0"/>
      <text class="t mut" x="106" y="106" font-size="11" text-anchor="middle">30 分钟</text>
      <text class="t mut" x="172" y="106" font-size="11" text-anchor="middle">1 小时</text>
      <text class="t mut" x="230" y="106" font-size="11" text-anchor="middle">2 小时</text>
      <rect x="264" y="90" width="58" height="22" rx="6" fill="#fff" stroke="#DDE3DF"/><text class="t dk" x="293" y="106" font-size="11" font-weight="700" text-anchor="middle">4 小时</text>
      <text class="t mut" x="356" y="106" font-size="11" text-anchor="middle">8 小时</text>
      <text class="t mut" x="440" y="106" font-size="11" text-anchor="middle">一天一次</text>

      <!-- sources -->
      <text class="t sub" x="24" y="146" font-size="12">来源</text>
      <rect x="72" y="136" width="12" height="12" rx="3" fill="#fff" stroke="#9BAAA2"/><path d="M75 142 l2.4 2.6 L81.4 138.6" stroke="#5B6B62" stroke-width="1.6" fill="none"/>
      <text class="t dk" x="92" y="147" font-size="12" font-weight="700">自动化提炼</text>
      <text class="t sub" x="164" y="147" font-size="11">窗口内的工作留痕（比如 15 分钟一次，四小时就是 16 条）由</text>
      <text class="t sub" x="92" y="163" font-size="11">模型合并成一段。这段时间没开提炼 → 这一段不出现。</text>

      <rect x="72" y="176" width="12" height="12" rx="3" fill="#fff" stroke="#9BAAA2"/><path d="M75 182 l2.4 2.6 L81.4 178.6" stroke="#5B6B62" stroke-width="1.6" fill="none"/>
      <text class="t dk" x="92" y="187" font-size="12" font-weight="700">本地邮箱</text>
      <text class="t sub" x="152" y="187" font-size="11">窗口内收到的邮件合并成一段；窗口内没有新邮件则退回</text>
      <text class="t sub" x="92" y="203" font-size="11">「谁在等你」。会真去读一次 Outlook。</text>

      <text class="t grn" x="24" y="221" font-size="11.5">✓ 已推送：提炼 0 次 / 邮件 1 封。</text>
      <text class="t mut" x="216" y="221" font-size="11.5">（03-04 07:48）</text>
    </g>

    <!-- notes -->
    <g transform="translate(300,398)">
      <text class="t sub" x="0" y="14" font-size="11.5">○ <tspan font-weight="700" class="dk">收件人只能是你自己。</tspan>身份取自本机飞书登录态，接口不提供指定收件人的入口，也不会发到任何群。</text>
      <text class="t sub" x="0" y="40" font-size="11.5">◦ 以<tspan font-weight="700">你自己的身份</tspan>发送（内置应用没有机器人发消息权限），所以飞书里显示为你自己发的。用户身份授权是 <tspan font-weight="700">7 天滚动</tspan>的：</text>
      <text class="t sub" x="14" y="58" font-size="11.5">正常用着一直有效，连续七天不碰本应用需要重新登录。</text>
      <text class="t" x="0" y="88" font-size="11.5" fill="#B45309">⚠ 勾选「本地邮箱」意味着每次汇总会<tspan font-weight="700">真去读一次 Outlook</tspan>，并按现有设置把邮件主题和正文前 400 字发到云端模型做</text>
      <text class="t" x="14" y="106" font-size="11.5" fill="#B45309">语义分析 —— <tspan font-weight="700">那一刻没有人在旁边确认</tspan>。</text>
    </g>
  </g>
</svg>
