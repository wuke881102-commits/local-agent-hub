        <text class="mut" x="32" y="102" font-size="10">产品部</text>
        <rect x="186" y="80" width="36" height="20" rx="6" fill="#E3F5EA"/><text class="grn" x="204" y="94" font-size="10.5" font-weight="700" text-anchor="middle">▲2</text>
        <rect x="16" y="118" width="8" height="8" rx="2" fill="#F59E0B"/>
        <text class="sub" x="32" y="124">渠道组</text><text class="mut" x="32" y="138" font-size="10">市场部</text>
        <rect x="186" y="116" width="36" height="20" rx="6" fill="#FDECEC"/><text x="204" y="130" font-size="10.5" font-weight="700" fill="#C83A3A" text-anchor="middle">▼1</text>
