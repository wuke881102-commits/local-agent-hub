      <text class="t mut" x="836" y="32" font-size="11.5" text-anchor="end">上次读取 09:41 · 缓存 5 分钟</text>
      <rect x="856" y="12" width="106" height="28" rx="8" fill="#fff" stroke="#E0E6E2"/><text class="t sub" x="909" y="31" font-size="12" text-anchor="middle">⟳ 刷新邮件</text>
      <rect x="972" y="12" width="110" height="28" rx="8" fill="#fff" stroke="#E0E6E2"/><text class="t sub" x="1027" y="31" font-size="12" text-anchor="middle">▤ 信息矩阵</text>
