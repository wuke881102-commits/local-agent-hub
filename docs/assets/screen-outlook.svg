          <text class="t dk" x="14" y="26" font-size="13" font-weight="700">示例：周五评审能否改期</text>
          <text class="t mut" x="14" y="46" font-size="11.5">Casey · 昨天 11:05 · 会话 1 封</text>
          <rect x="14" y="58" width="72" height="20" rx="6" fill="#EEF2F0"/><text class="t sub" x="50" y="72" font-size="10.5" text-anchor="middle">会议邀请</text>
