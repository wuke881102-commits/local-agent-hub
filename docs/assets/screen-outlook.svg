      <g>
        <rect class="card" width="355" height="452" rx="14"/>
        <rect x="0" y="0" width="355" height="46" rx="14" fill="#FEF2F2"/><rect x="0" y="32" width="355" height="14" fill="#FEF2F2"/>
        <text class="t" x="20" y="30" font-size="13.5" font-weight="800" fill="#DC2626">需我回复</text>
