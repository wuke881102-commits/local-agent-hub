        <g transform="translate(16,192)">
          <rect width="323" height="100" rx="10" fill="#FCFDFC" stroke="#EEF2F0"/>
          <text class="t dk" x="14" y="26" font-size="13" font-weight="700">示例：验收标准第 3 条歧义</text>
          <text class="t mut" x="14" y="46" font-size="11.5">Blair · 昨天 17:40 · 会话 2 封</text>
          <rect x="14" y="58" width="62" height="20" rx="6" fill="#FEF3C7"/><text class="t" x="45" y="72" font-size="10.5" fill="#92400E" text-anchor="middle">等我回 1 天</text>
          <rect x="84" y="58" width="52" height="20" rx="6" fill="#EEF2F0"/><text class="t sub" x="110" y="72" font-size="10.5" text-anchor="middle">业务</text>
