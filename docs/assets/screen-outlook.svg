      <text class="t dk" x="126" y="31" font-size="12.5">示例邮箱 A（主）</text><text class="t mut" x="344" y="31" font-size="11">▾</text>
      <text class="t sub" x="380" y="32" font-size="11.5">收件箱和已发送一起切 · 一次只读一个邮箱 · 选择会记住</text>
      <rect x="892" y="12" width="190" height="28" rx="8" fill="#E8F7EE"/>
      <text class="t grn" x="987" y="31" font-size="11.5" text-anchor="middle" font-weight="700">另有：示例邮箱 B（委派）</text>
