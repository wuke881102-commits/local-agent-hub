    <text class="t sub" x="36" y="124" font-size="12.5">直接读桌面 Outlook（COM）· 邮件不出本机 · 只读：不发送 / 不回复 / 不删除 / 不改已读</text>

    <!-- mailbox picker -->
    <g transform="translate(36,144)">
      <rect class="card" width="1106" height="52" rx="12"/>
      <text class="t dk" x="24" y="32" font-size="12.5" font-weight="700">读哪个邮箱</text>
