          <text class="t dk" x="14" y="26" font-size="13" font-weight="700">示例：合规问卷待填写</text>
          <text class="t mut" x="14" y="46" font-size="11.5">Erin · 前天 14:22</text>
          <rect x="14" y="58" width="52" height="20" rx="6" fill="#EEF2F0"/><text class="t sub" x="40" y="72" font-size="10.5" text-anchor="middle">行政</text>
