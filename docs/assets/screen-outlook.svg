          <rect x="94" y="58" width="52" height="20" rx="6" fill="#EEF2F0"/><text class="t sub" x="120" y="72" font-size="10.5" text-anchor="middle">决策</text>
          <text class="t sub" x="14" y="98" font-size="11.5">对方最后一句：麻烦本周内给个明确时间。</text>
