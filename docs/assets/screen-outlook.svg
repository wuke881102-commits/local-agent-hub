        <rect x="0" y="0" width="355" height="46" rx="14" fill="#F0F9FF"/><rect x="0" y="32" width="355" height="14" fill="#F0F9FF"/>
        <text class="t" x="20" y="30" font-size="13.5" font-weight="800" fill="#0369A1">知会即可</text>
        <rect x="104" y="14" width="34" height="20" rx="6" fill="#BAE6FD"/><text class="t" x="121" y="29" font-size="11.5" font-weight="700" fill="#075985" text-anchor="middle">18</text>
        <g transform="translate(16,62)">
          <rect width="323" height="86" rx="10" fill="#FCFDFC" stroke="#EEF2F0"/>
          <text class="t dk" x="14" y="26" font-size="13" font-weight="700">示例：系统维护通知</text>
          <text class="t mut" x="14" y="46" font-size="11.5">示例平台 · 今天 07:00</text>
          <rect x="14" y="58" width="52" height="20" rx="6" fill="#E0F2FE"/><text class="t" x="40" y="72" font-size="10.5" fill="#0369A1" text-anchor="middle">告警</text>
        </g>
        <g transform="translate(16,160)">
          <rect width="323" height="86" rx="10" fill="#FCFDFC" stroke="#EEF2F0"/>
          <text class="t dk" x="14" y="26" font-size="13" font-weight="700">示例：本周行业简报</text>
          <text class="t mut" x="14" y="46" font-size="11.5">示例订阅 · 今天 06:10</text>
          <rect x="14" y="58" width="64" height="20" rx="6" fill="#EEF2F0"/><text class="t sub" x="46" y="72" font-size="10.5" text-anchor="middle">订阅资讯</text>
        </g>
        <rect x="16" y="258" width="323" height="60" rx="10" fill="#F7FAF8"/>
        <text class="t sub" x="30" y="282" font-size="11.5">◔ 广告 / 订阅资讯 / 工单流水不进「信息矩阵」</text>
