    <!-- footer -->
    <g transform="translate(36,790)">
      <rect class="card" width="1106" height="38" rx="10"/>
      <text class="t mut" x="18" y="24" font-size="11.5">当天</text>
      <text class="t sub" x="70" y="24" font-size="11.5">读 <tspan font-weight="700">示例邮箱 A（主）</tspan> · 不发送 · 不修改邮件</text>
      <text class="t mut" x="360" y="24" font-size="11.5">23 封 → 12 个会话 · 2148 ms</text>
      <text class="t" x="1088" y="24" font-size="11.5" fill="#B45309" text-anchor="end">本次外发 2 批 / 3.1k 字 → 快省档文本模型（可用 OUTLOOK_AI_ENRICH=false 关闭）</text>
    </g>
