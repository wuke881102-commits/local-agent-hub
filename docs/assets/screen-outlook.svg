      <rect x="156" y="12" width="72" height="28" rx="8" fill="#EEF2F0"/><text class="t sub" x="192" y="31" font-size="12" text-anchor="middle">近 3 天</text>
      <rect x="236" y="12" width="72" height="28" rx="8" fill="#EEF2F0"/><text class="t sub" x="272" y="31" font-size="12" text-anchor="middle">近 7 天</text>
